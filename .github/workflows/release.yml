name: Release

# horizon-studio-mcp for each platform and the game with Horizon Studio built in
# (Linux x86_64, macOS Apple silicon), with SHA256SUMS, on a release tag
# (v0.1.0...): what mcp/install.sh, mcp/install.ps1 and install.sh download. Run by hand
# (Actions > Release > Run workflow) with a tag, it publishes that release
# from the branch it runs on; without one it only builds.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Publish a release with this tag (v0.1.0); empty: build only"
        required: false
        default: ""
      notes:
        description: "The release's notes, in Markdown (empty: the standard line)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  mcp:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, musl: true, run: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, musl: true, run: true }
          - { os: macos-15, target: aarch64-apple-darwin, run: true }
          - { os: macos-15, target: x86_64-apple-darwin, run: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, run: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --bin horizon-studio-mcp --target ${{ matrix.target }}
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
      - name: It answers MCP
        if: matrix.run
        shell: bash
        run: |
          exe=target/${{ matrix.target }}/release/horizon-studio-mcp
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"check_mod","arguments":{"id":"hi","files":{"hi.lua":"command(\"hi\", function() return \"hi\" end)"},"mods_dir":"none"}}}' \
            | "$exe" > answers.jsonl
          cat answers.jsonl
          grep -q '"protocolVersion":"2025-06-18"' answers.jsonl
          grep -q 'running' answers.jsonl
      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "$GITHUB_WORKSPACE/horizon-studio-mcp-${{ matrix.target }}.zip" horizon-studio-mcp.exe
          else
            tar -czf "$GITHUB_WORKSPACE/horizon-studio-mcp-${{ matrix.target }}.tar.gz" horizon-studio-mcp
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-${{ matrix.target }}
          path: horizon-studio-mcp-${{ matrix.target }}.*

  # The modded game, built as the launcher builds it (its Rust, the release profile, the same
  # horizon-mixins and bundle), for install.sh to put in place instead of compiling it.
  game:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: macos-15, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The launcher's Rust at the pinned Horizon (launcher/src/rust_toolchain.rs).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target/horizon-mixins
            target/game
          key: prebuilt-${{ matrix.target }}-${{ hashFiles('compatibility.json') }}
      - name: The launcher's name for this build, checked against install.sh's
        run: python3 tools/studio.py native-key
      - name: Build and pack
        run: python3 tools/studio.py prebuilt --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: game-${{ matrix.target }}
          path: target/horizon-studio-game-${{ matrix.target }}.tar.gz

  release:
    needs: [mcp, game]
    # Published with the MCP server even if a game build failed: install.sh compiles where there is none.
    if: always() && needs.mcp.result == 'success' && (startsWith(github.ref, 'refs/tags/') || inputs.tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum horizon-studio-* > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          NOTES: ${{ inputs.notes }}
        run: |
          notes="${NOTES:-Horizon Studio, built into the game for Linux and macOS (install.sh), and horizon-studio-mcp, its MCP server for AI agents. Install: see the README.}"
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Horizon Studio $TAG" --notes "$notes" \
            || gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
