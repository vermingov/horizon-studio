[package]
name = "horizon-studio"
version = "0.10.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false
description = "Horizon Studio: a Lua mod creator for Horizon, with hot reloading, an in-game editor and console, and a mod library."

# The voice chat's bundle crate (mixins/horizon_studio/voice) is a member, so
# it builds with this lock and no Cargo.lock of its own lands in the bundle.
[workspace]
members = ["mixins/horizon_studio/voice"]
# The protocol crate's stand-in stays a package of its own (cargo fmt leaves ViaHorizon's file in it as it is),
# and so does the Opus check's command (tools/opus_interop.py builds it).
exclude = ["tests/shim/horizon-protocol", "tools/opus_interop"]

# The bundle's modules, mounted as the game mounts them (crate::game::<name>),
# so their tests run here without the game.
[lib]
path = "src/lib.rs"

[dependencies]
# The game has it (horizon-client); the studio reads the agent's JSON replies with it.
serde_json = { version = "1", features = ["preserve_order"] }
# The game has it too (zip 2, deflate): dropped .zip mods.
zip = { version = "2", default-features = false, features = ["deflate"] }
# ViaHorizon's downloads, as the game has them: HTTPS (ureq 2 with rustls),
# gzip (the Java runtime's archive) and SHA-256 (pinned checksums).
ureq = { version = "2", default-features = false, features = ["tls"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
sha2 = "0.10.9"
# The game has it too (sha1 0.10): crypt's SHA-1 and the WebSocket handshake.
sha1 = "0.10"
# The game has it (png 0.18): textures from script mods' PNG files.
png = "0.18"
# The game's protocol crate, as far as ViaHorizon uses it: its added module.
horizon-protocol = { path = "tests/shim/horizon-protocol" }
# The voice chat's engine, the bundle's own crate: without its `audio`
# feature (cpal, which needs ALSA's headers), as the tests drive it by hand.
hstudio_voice = { path = "mixins/horizon_studio/voice", default-features = false }

[dev-dependencies]
# The preview test (tests/preview.rs): Horizon's fonts, rasterized as the game does, into PNG files.
ab_glyph = "0.2.32"
