[mod]
id = "horizon_studio"
version = "0.8.0"
priority = 100

# Pinned: besides Horizon's native hook points, the studio hooks the window's
# events (follow_keymap, to take the keyboard while it is open), the
# per-frame control poll (for the event loop the agent commands need), the
# server's chat lines (signed_chat_line), the chat's completion requests
# (send_suggestion_request), the world's entity geometry (end_geometry) and
# the last HUD layer (remote_hud). Every target's body is free of macros but
# the standard ones horizon-mixins a2af5c0 (the launcher's) keeps under a
# HEAD hook (signed_chat_line's matches!).
[compatibility]
horizon_revision = "4aa6854a886183440256f4f4a4a9d1ed853227a1"

