# ViaHorizon: every join goes through ViaProxy (beside the game), which
# translates to the version chosen. In the protocol crate: where a routed
# join connects, and OpenAuthMod's sign-in answers; in the game's net: the
# manager (public, for the studio) and the account's sign-in.
[[module]]
id = "via-net"
file = "crates/horizon-protocol/src/lib.rs"
name = "hstudio_via_net"
source = "via_net.rs"
visibility = "pub"

[[module]]
id = "via"
file = "crates/horizon-client/src/net.rs"
name = "hstudio_via"
source = "via.rs"
visibility = "pub"

[[module]]
id = "mcp-update"
file = "crates/horizon-client/src/net.rs"
name = "hstudio_mcp_update"
source = "mcp_update.rs"
visibility = "pub"

[[module]]
id = "via-lend"
file = "crates/horizon-client/src/net.rs"
name = "hstudio_via_lend"
source = "via_lend.rs"
visibility = "pub"

[[module]]
id = "via-auth"
file = "crates/horizon-client/src/net.rs"
name = "hstudio_via_auth"
source = "via_auth.rs"

# Joins and the server list's pings: a routed address parses as ViaProxy's
# internal host, whose SRV lookup points at ViaProxy.
[[injection]]
id = "via-address"
kind = "HEAD"
cancellable = true
target = "horizon_protocol::servers::parse_address"
helper = "via_address.rs"
bindings = [
  { name = "text", ty = "&str", value = "text" },
]

# A login's resolving: a routed host connects to the local ViaProxy and keeps
# its own name in the handshake (Horizon, as vanilla, otherwise sends the
# redirect target's), which is how ViaProxy knows the server and version.
[[injection]]
id = "via-resolve"
kind = "HEAD"
cancellable = true
target = "horizon_protocol::resolver::resolve"
helper = "via_resolve.rs"
bindings = [
  { name = "host", ty = "&str", value = "host" },
  { name = "port", ty = "u16", value = "port" },
]

# A join that ViaHorizon ends (not signed in, its sign-in failing) ends with
# its reason as it is written; Horizon words other failures as an "Internal
# Exception".
[[injection]]
id = "via-reason"
kind = "HEAD"
cancellable = true
target = "horizon_client::net::connection_lost"
helper = "via_reason.rs"
bindings = [
  { name = "e", ty = "&horizon_protocol::Error", value = "&e" },
]

[[injection]]
id = "via-srv"
kind = "HEAD"
cancellable = true
target = "horizon_protocol::resolver::srv_redirect"
helper = "via_srv.rs"
bindings = [
  { name = "name", ty = "&str", value = "name" },
]

# Login packets: OpenAuthMod's join requests are answered.
[[injection]]
id = "via-recv"
kind = "HEAD"
cancellable = true
target = "horizon_protocol::connection::Connection::recv"
helper = "via_recv.rs"
bindings = [
  { name = "conn", ty = "&mut Connection", value = "&mut *self" },
]

# Play packets: while the game draws no frames, the server's pings are
# answered on the network thread (hstudio_via_net::answer_ping).
[[injection]]
id = "via-ping"
kind = "HEAD"
cancellable = true
target = "horizon_protocol::connection::ConnReader::recv"
helper = "via_ping.rs"
bindings = [
  { name = "reader", ty = "&mut ConnReader", value = "&mut *self" },
]

# Sent packets: a pong the network thread already sent for the game is
# dropped, so the server gets each once, in order.
[[injection]]
id = "via-pong"
kind = "HEAD"
cancellable = true
target = "horizon_protocol::connection::ConnWriter::send"
helper = "via_pong.rs"
bindings = [
  { name = "body", ty = "&[u8]", value = "body" },
]

# A join (or a transfer) notes the account it is made as.
[[injection]]
