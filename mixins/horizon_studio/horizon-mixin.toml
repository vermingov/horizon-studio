[mod]
id = "horizon_studio"
version = "0.1.0"
priority = 100

# Pinned: besides Horizon's native hook points, the studio hooks the window's
# events (follow_keymap, to take the keyboard while it is open), the
# per-frame control poll (for the event loop the agent commands need), the
# server's chat lines, the world's entity geometry (end_geometry) and the last
# HUD layer (remote_hud). Every target's body
# is free of macros, as horizon-mixins 0d6b103 (the launcher's) requires.
[compatibility]
horizon_revision = "baa379d71777f06a95b4e7650b2209a3d4209033"

# The modules, in the game's crate as crate::game::<name>.
[[module]]
id = "lua"
file = "crates/horizon-client/src/game.rs"
name = "hstudio_lua"
source = "lua.rs"

[[module]]
id = "lualib"
file = "crates/horizon-client/src/game.rs"
name = "hstudio_lualib"
source = "lualib.rs"

[[module]]
id = "studio"
file = "crates/horizon-client/src/game.rs"
name = "hstudio"
source = "studio.rs"

[[module]]
id = "ui"
file = "crates/horizon-client/src/game.rs"
name = "hstudio_ui"
source = "ui.rs"

[[module]]
id = "look"
file = "crates/horizon-client/src/game.rs"
name = "hstudio_look"
source = "look.rs"

[[module]]
id = "examples"
file = "crates/horizon-client/src/game.rs"
name = "hstudio_examples"
source = "examples.rs"

[[module]]
id = "via-picker"
file = "crates/horizon-client/src/game.rs"
name = "hstudio_via_picker"
source = "via_picker.rs"

[[module]]
id = "via-menu"
file = "crates/horizon-client/src/game.rs"
name = "hstudio_via_menu"
source = "via_menu.rs"

[[module]]
id = "natrium"
file = "crates/horizon-client/src/game.rs"
name = "hstudio_natrium"
source = "natrium.rs"

[[module]]
id = "bridge"
file = "crates/horizon-client/src/game.rs"
name = "hstudio_bridge"
source = "bridge.rs"

# In the game's library, inside its design-system toolkit (ui_theme), whose
# font cache and shapes it reuses; public, for the studio in the game.
[[module]]
id = "paint"
file = "crates/horizon-client/src/ui_theme.rs"
name = "hstudio_paint"
source = "paint.rs"
visibility = "pub"

# Hooks.
[[injection]]
id = "frame"
kind = "HEAD"
target = "horizon_client::game::control::Game<'_>::poll_control"
helper = "frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "event_loop", ty = "&winit::event_loop::ActiveEventLoop", value = "event_loop" },
]

# window_event hands each event to follow_keymap first: while the studio is
# open, it queues keys, clicks and the wheel for itself and puts an event the
# game ignores in their place.
[[injection]]
id = "window-input"
kind = "HEAD"
target = "horizon_client::game::follow_keymap"
helper = "keymap.rs"
bindings = [
  { name = "event", ty = "&mut winit::event::WindowEvent", value = "&mut *event" },
]

[[injection]]
id = "hud"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_hud"
helper = "hud.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "corners", ty = "&mut horizon_client::extras_hud::Corners", value = "&mut *corners" },
]

[[injection]]
id = "overlay"
kind = "HEAD"
target = "horizon_client::game::remote::Game<'_>::remote_hud"
helper = "overlay.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
]

# end_geometry (every frame in a world) gets the frame's camera and the
# entity geometry: on("world") handlers draw solid, depth-tested shapes into it.
[[injection]]
id = "world"
kind = "HEAD"
target = "horizon_client::game::end::Game<'_>::end_geometry"
helper = "world.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "camera", ty = "glam::DVec3", value = "camera" },
  { name = "out", ty = "&mut Vec<horizon_client::mesher::Vertex>", value = "&mut *out" },
]

[[injection]]
id = "key"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_key"
helper = "key.rs"
bindings = [
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

[[injection]]
id = "command"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_command"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

[[injection]]
id = "chat"
kind = "HEAD"
target = "horizon_client::game::remote::Game<'_>::chat_line"
helper = "chat.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "content", ty = "&horizon_client::text::Text", value = "&content" },
  { name = "source", ty = "&horizon_client::chat::ChatSource", value = "&source" },
]

[[injection]]
id = "zoom"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_zoom"
helper = "zoom.rs"
bindings = [
  { name = "zoom", ty = "&mut Option<crate::game::native_hooks::NativeZoom>", value = "&mut *zoom" },
]

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]

# ViaHorizon: every join goes through ViaProxy (beside the game), which
# translates to the version chosen. In the protocol crate: where a routed
# join connects, and OpenAuthMod's sign-in answers; in the game's net: the
# manager (public, for the studio) and the account's sign-in.
[[module]]
id = "via-net"
file = "crates/horizon-protocol/src/lib.rs"
name = "hstudio_via_net"
source = "via_net.rs"
visibility = "pub"

[[module]]
id = "via"
file = "crates/horizon-client/src/net.rs"
name = "hstudio_via"
source = "via.rs"
visibility = "pub"

[[module]]
id = "via-auth"
file = "crates/horizon-client/src/net.rs"
name = "hstudio_via_auth"
source = "via_auth.rs"

# Joins and the server list's pings: a routed address parses as ViaProxy's
# internal host, whose SRV lookup points at ViaProxy.
[[injection]]
id = "via-address"
kind = "HEAD"
cancellable = true
target = "horizon_protocol::servers::parse_address"
helper = "via_address.rs"
bindings = [
  { name = "text", ty = "&str", value = "text" },
]

[[injection]]
id = "via-srv"
kind = "HEAD"
cancellable = true
target = "horizon_protocol::resolver::srv_redirect"
helper = "via_srv.rs"
bindings = [
  { name = "name", ty = "&str", value = "name" },
]

# Login packets: OpenAuthMod's join requests are answered.
[[injection]]
id = "via-recv"
kind = "HEAD"
cancellable = true
target = "horizon_protocol::connection::Connection::recv"
helper = "via_recv.rs"
bindings = [
  { name = "conn", ty = "&mut Connection", value = "&mut *self" },
]

# A join (or a transfer) notes the account it is made as.
[[injection]]
id = "via-session"
kind = "HEAD"
target = "horizon_client::net::Session::connect"
helper = "via_session.rs"
bindings = [
  { name = "auth", ty = "&Option<Arc<AuthSession>>", value = "&auth" },
  { name = "lang", ty = "&Arc<Language>", value = "&lang" },
]

[[injection]]
id = "via-transfer"
kind = "HEAD"
target = "horizon_client::net::Session::connect_transferred"
helper = "via_transfer.rs"
bindings = [
  { name = "auth", ty = "&Option<Arc<AuthSession>>", value = "&auth" },
  { name = "lang", ty = "&Arc<Language>", value = "&lang" },
]

# ViaHorizon's button on the multiplayer screen: drawn after the game's title
# screen (draw_link_prompt comes next each frame) and the startup menu's.
[[injection]]
id = "via-menu-draw"
kind = "HEAD"
target = "horizon_client::game::chat::Game<'_>::draw_link_prompt"
helper = "via_menu_draw.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
]

[[injection]]
id = "via-startup"
kind = "RETURN"
target = "horizon_client::game::startup_menu::Loading::draw_menu"
helper = "via_startup.rs"
bindings = [
  { name = "value", ty = "()", value = "$value" },
  { name = "loading", ty = "&mut super::Loading", value = "&mut *self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
]

# Natrium: its switches in horizon-core (read by the renderer and the
# server), its particle loop in the game's particles module.
[[module]]
id = "natrium-flags"
file = "crates/horizon-core/src/lib.rs"
name = "natrium"
source = "natrium_flags.rs"
visibility = "pub"

[[module]]
id = "natrium-particles"
file = "crates/horizon-client-render/src/particles.rs"
name = "natrium_particles"
source = "natrium_particles.rs"

# The frame's camera frustum, kept for particle culling.
[[injection]]
id = "natrium-view"
kind = "RETURN"
target = "horizon_client_render::gfx::Renderer::camera_frustum"
helper = "natrium_view.rs"
bindings = [
  { name = "value", ty = "Frustum", value = "$value" },
]

# Particles: Natrium's loop, which leaves out those outside the view.
[[injection]]
id = "natrium-particles-render"
kind = "HEAD"
cancellable = true
target = "horizon_client_render::particles::ParticleEngine::render"
helper = "natrium_render.rs"
bindings = [
  { name = "engine", ty = "&ParticleEngine", value = "self" },
  { name = "camera", ty = "DVec3", value = "camera" },
  { name = "yaw", ty = "f32", value = "yaw" },
  { name = "pitch", ty = "f32", value = "pitch" },
  { name = "partial", ty = "f32", value = "partial" },
  { name = "light_at", ty = "&dyn Fn([i32; 3]) -> u8", value = "light_at" },
  { name = "out", ty = "&mut Vec<Vertex>", value = "&mut *out" },
]

# Each frame: whether fog culling applies, and where the fog ends.
[[injection]]
id = "natrium-frame"
kind = "HEAD"
target = "horizon_client_render::gfx::Renderer::render"
helper = "natrium_frame.rs"
bindings = [
  { name = "renderer", ty = "&Renderer", value = "&*self" },
  { name = "frame", ty = "&Frame<'_>", value = "frame" },
]

# Sections wholly inside that fog are left out of the frame.
[[injection]]
id = "natrium-fog"
kind = "RETURN"
target = "horizon_client_render::gfx::resident::in_frustum"
helper = "natrium_fog.rs"
bindings = [
  { name = "value", ty = "Option<(f64, Vec3)>", value = "$value" },
]


# Natrium's faster ticks: the same results, less work.
[[module]]
id = "natrium-items"
file = "crates/horizon-client/src/entities.rs"
name = "natrium_items"
source = "natrium_items.rs"

[[module]]
id = "natrium-villagers"
file = "crates/horizon-client/src/game/villagers.rs"
name = "natrium_villagers"
source = "natrium_villagers.rs"

[[module]]
id = "natrium-paths"
file = "crates/horizon-client/src/mobs/path.rs"
name = "natrium_paths"
source = "natrium_paths.rs"

# Item merging: each stack's size looked up once, the neighbour list kept.
[[injection]]
id = "natrium-merge"
kind = "HEAD"
cancellable = true
target = "horizon_client::entities::merge_with_neighbours"
helper = "natrium_merge.rs"
bindings = [
  { name = "items", ty = "&mut [ItemEntity]", value = "&mut *items" },
  { name = "removed", ty = "&mut [bool]", value = "&mut *removed" },
  { name = "cells", ty = "&mut ItemCells", value = "&mut *cells" },
  { name = "i", ty = "usize", value = "i" },
  { name = "max_stack", ty = "&dyn Fn(&ItemStack) -> u32", value = "max_stack" },
]

# Villagers' item pickup: where an item is before what it is.
[[injection]]
id = "natrium-pickups"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::villagers::Game<'_>::villager_pickups"
helper = "natrium_pickups.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# Swimmers' path search: a node's sides in an array, not a hash map.
[[injection]]
id = "natrium-swim"
kind = "HEAD"
cancellable = true
target = "horizon_client::mobs::path::Finder<'_,'_>::swim_neighbors"
helper = "natrium_swim.rs"
bindings = [
  { name = "finder", ty = "&mut Finder<'_, '_>", value = "&mut *self" },
  { name = "pos", ty = "u32", value = "pos" },
  { name = "out", ty = "&mut Vec<u32>", value = "&mut *out" },
]

# Natrium in Video Settings, as Sodium is in Java's: its section follows
# Preferences, its buttons are its Options > Mods page's.
[[module]]
id = "natrium-video"
file = "crates/horizon-client-render/src/options_ui.rs"
name = "natrium_video"
source = "natrium_video.rs"

[[injection]]
id = "natrium-video-rows"
kind = "HEAD"
cancellable = true
target = "horizon_client_render::options_ui::pairs"
helper = "natrium_video_rows.rs"
bindings = [
  { name = "opts", ty = "&[Opt]", value = "opts" },
]

# The settings search's text, which the section follows.
[[injection]]
id = "natrium-video-search"
kind = "HEAD"
target = "horizon_client_render::options_ui::OptionsUi::page"
helper = "natrium_video_search.rs"
bindings = [
  { name = "ui", ty = "&OptionsUi", value = "self" },
]
